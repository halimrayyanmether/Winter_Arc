<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05161A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MINKA Admin">
  <meta name="description" content="MINKA Admin — your shop, at a glance. Interactive demonstration with sample data.">
  <title>MINKA Admin</title>
  <link rel="icon" href="./assets/minka-admin-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="app-header"><a class="brand" href="#home" aria-label="MINKA home"><img src="./assets/minka-admin-icon.svg" alt=""><span>MINKA<small>ADMIN</small></span></a><div class="header-right"><span class="demo"><i></i> DEMO</span><button class="icon-button" id="refresh" aria-label="Refresh demo data"></button></div></header>
    <main id="main" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Main navigation"></nav>
  </div>
  <dialog id="filter-dialog" class="sheet"><form id="filter-form"><div class="sheet-handle"></div><div class="sheet-heading"><div><span class="eyebrow">MAKE IT YOUR VIEW</span><h2>Time period filter</h2></div><button type="button" class="icon-button close-sheet" aria-label="Close filter">✕</button></div><div id="presets"></div><div class="custom-range"><span class="eyebrow">CUSTOM TIME PERIOD</span><label>From<input type="date" id="date-from" required></label><label>To<input type="date" id="date-to" required></label><p id="date-error" role="alert"></p></div><button class="primary" type="submit">Apply period <span>→</span></button></form></dialog>
  <dialog id="detail-dialog" class="sheet"><div class="sheet-handle"></div><button class="icon-button close-detail" aria-label="Close details">✕</button><div id="detail-content"></div></dialog>
  <div id="toast" role="status"></div>
</body>
</html>
