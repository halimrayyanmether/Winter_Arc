<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Winter Arc Tracker</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Winter Arc">
  <meta name="theme-color" content="#000000">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            iosDark: '#000000',
            iosCard: '#1c1c1e',
            iosCardSecondary: '#2c2c2e',
            iosCardBorder: '#38383a',
            iosSubtext: '#8e8e93',
            iosKeypad: '#242426',
            iosBlue: '#0a84ff',
            iosGreen: '#30d158',
            iosRed: '#ff453a'
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            num: ['Sora', '-apple-system', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }
    input, textarea {
      user-select: text;
      -webkit-user-select: text;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      padding-top: max(env(safe-area-inset-top), 16px);
      padding-bottom: env(safe-area-inset-bottom);
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }
    .font-num {
      font-family: 'Sora', -apple-system, system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .custom-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .custom-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .drag-item.dragging {
      opacity: 0.45;
      background-color: #2c2c2e;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col font-sans bg-black text-white antialiased">

  <!-- TOP APP BAR: Pushed down for iOS notch/island clearance -->
  <header class="w-full pt-4 sm:pt-5 px-4 pb-2.5 flex items-center justify-between shrink-0 z-10 border-b border-neutral-900/80">
    <!-- Arrow-Only Date Selector -->
    <div class="flex items-center space-x-1.5 bg-[#1c1c1e] px-2 py-1 rounded-full border border-neutral-800 shadow-sm">
      <button id="prevDayBtn" aria-label="Previous Day" class="w-7 h-7 rounded-full bg-[#2c2c2e] hover:bg-[#3a3a3c] active:scale-90 transition-all flex items-center justify-center text-white">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>

      <span id="dateDisplayLabel" class="text-xs sm:text-sm font-semibold font-num text-neutral-200 px-2 min-w-[125px] text-center select-none truncate">Today, 01 Oct</span>

      <button id="nextDayBtn" aria-label="Next Day" class="w-7 h-7 rounded-full bg-[#2c2c2e] hover:bg-[#3a3a3c] active:scale-90 transition-all flex items-center justify-center text-white">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </div>

    <!-- 3-Dots Action Button -->
    <button id="moreMenuBtn" aria-label="More options" class="w-9 h-9 rounded-full bg-[#1c1c1e] hover:bg-[#2c2c2e] active:scale-90 transition-all flex items-center justify-center text-white border border-neutral-800">
      <svg class="w-5 h-5 text-neutral-200" fill="currentColor" viewBox="0 0 20 20">
        <path d="M6 10a2 2 0 11-4 0 2 2 0 014 0zM12 10a2 2 0 11-4 0 2 2 0 014 0zM16 12a2 2 0 100-4 2 2 0 000 4z"/>
      </svg>
    </button>
  </header>

  <!-- MAIN WRAPPER -->
  <main class="flex-1 flex flex-col px-3.5 pt-2 pb-3 overflow-hidden gap-2">
    
    <!-- BIG DAY EXECUTION BAR CARD: Clickable to view Heatmap -->
    <section id="dayExecutionCard" role="button" tabindex="0" class="bg-[#1c1c1e] hover:bg-[#222225] active:scale-[0.99] cursor-pointer rounded-2xl p-3 border border-[#2c2c2e] shadow-lg shrink-0 transition-all">
      <div class="flex items-center justify-between mb-1.5">
        <div class="flex items-center space-x-2">
          <span class="text-xs uppercase tracking-wider text-neutral-400 font-semibold">Day Execution</span>
          <!-- Replaced streak badge with ratio -->
          <span id="doneRatioLabel" class="text-[10px] font-num bg-neutral-800 text-neutral-300 px-2 py-0.5 rounded-full border border-neutral-700/60">0/15</span>
        </div>
        <div class="flex items-baseline space-x-1.5">
          <span id="percentLabel" class="text-sm font-bold font-num text-emerald-400">0%</span>
        </div>
      </div>

      <!-- Progress Track -->
      <div class="w-full bg-[#2c2c2e] h-3 rounded-full overflow-hidden p-0.5 border border-neutral-700/40">
        <div id="executionProgressBar" class="h-full bg-gradient-to-r from-emerald-500 to-green-400 rounded-full transition-all duration-300 w-0"></div>
      </div>
    </section>

    <!-- GOALS CONTAINER -->
    <section class="flex-1 overflow-y-auto custom-scrollbar rounded-2xl border border-[#2c2c2e] bg-[#121214] p-1.5 space-y-1">
      <div id="goalsContainer" class="flex flex-col gap-1"></div>
    </section>
  </main>

  <!-- 3-DOTS ACTION SHEET -->
  <div id="moreActionSheet" class="fixed inset-0 z-50 bg-black/70 hidden flex-col justify-end p-4 backdrop-blur-sm">
    <div class="bg-[#1c1c1e] rounded-2xl border border-neutral-800 divide-y divide-neutral-800 overflow-hidden mb-3">
      
      <!-- Manage / Edit Goals -->
      <button id="openGoalsManagerBtn" class="w-full py-3.5 px-4 text-left text-white text-sm font-medium active:bg-[#2c2c2e] flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <svg class="w-5 h-5 text-neutral-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
          </svg>
          <span>Edit Goals</span>
        </div>
        <div class="flex items-center space-x-2 text-neutral-400 text-xs">
          <span id="goalsCountBadge">15 Goals</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </div>
      </button>

      <!-- Haptic Toggle Switch -->
      <div class="w-full py-3 px-4 flex items-center justify-between text-white text-sm font-medium">
        <div class="flex items-center space-x-3">
          <svg class="w-5 h-5 text-neutral-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/>
          </svg>
          <span>Haptic & Audio Feedback</span>
        </div>
        <button id="hapticToggleBtn" type="button" class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out bg-blue-600 focus:outline-none">
          <span id="hapticToggleThumb" class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow-md ring-0 transition duration-200 ease-in-out translate-x-5"></span>
        </button>
      </div>

      <!-- Export CSV -->
      <button id="menuExportBtn" class="w-full py-3.5 px-4 text-left text-white text-sm font-medium active:bg-[#2c2c2e] flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <svg class="w-5 h-5 text-neutral-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
          </svg>
          <span>Export History (CSV)</span>
        </div>
        <svg class="w-4 h-4 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </button>

      <!-- Clear Selected Day -->
      <button id="menuResetDayBtn" class="w-full py-3.5 px-4 text-left text-red-500 text-sm font-medium active:bg-[#2c2c2e] flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
          <span>Clear Selected Day</span>
        </div>
      </button>
    </div>

    <!-- Dismiss Button -->
    <button id="closeMoreSheet" class="w-full py-3.5 bg-[#2c2c2e] text-white font-semibold rounded-2xl active:scale-98">Cancel</button>
    
    <div class="text-center text-[11px] tracking-widest uppercase text-neutral-500 font-medium pt-3 pb-1">
      A HRM APPLICATION
    </div>
  </div>

  <!-- GOALS MANAGER MODAL (With Drag and Drop Reordering) -->
  <div id="goalsManagerModal" class="fixed inset-0 z-50 bg-black/70 hidden items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-[#1c1c1e] rounded-3xl w-full max-w-sm border border-neutral-800 p-5 space-y-4 max-h-[85vh] flex flex-col">
      <div class="flex items-center justify-between pb-2 border-b border-neutral-800">
        <div>
          <h3 class="text-base font-bold text-white">Edit Arc Goals</h3>
          <p class="text-[10px] text-neutral-400">Drag items by handle to reorder</p>
        </div>
        <button id="closeGoalsManagerBtn" class="w-7 h-7 rounded-full bg-[#2c2c2e] text-neutral-400 flex items-center justify-center active:scale-90">✕</button>
      </div>
      
      <!-- New Goal Input -->
      <div class="flex space-x-2">
        <input id="newGoalInput" type="text" placeholder="Add custom goal..." class="flex-1 bg-[#2c2c2e] text-white text-xs px-3.5 py-2.5 rounded-xl border border-neutral-700 focus:outline-none">
        <button id="addNewGoalBtn" class="px-3.5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-semibold active:scale-95 transition-all">Add</button>
      </div>

      <!-- Current Goals Reorderable List -->
      <div id="goalsManagerList" class="flex-1 overflow-y-auto custom-scrollbar divide-y divide-neutral-800 space-y-1 pr-1"></div>
    </div>
  </div>

  <!-- 92-DAY WINTER ARC HEATMAP MODAL (Oct 1 to Dec 31) -->
  <div id="heatmapModal" class="fixed inset-0 z-50 bg-black/75 hidden items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-[#1c1c1e] rounded-3xl w-full max-w-sm border border-neutral-800 p-5 space-y-4 max-h-[88vh] flex flex-col">
      <div class="flex items-center justify-between pb-2 border-b border-neutral-800">
        <div>
          <h3 class="text-base font-bold text-white">Winter Arc Progress</h3>
          <p class="text-[11px] text-neutral-400">Oct 01 - Dec 31 (92 Days)</p>
        </div>
        <button id="closeHeatmapBtn" class="w-7 h-7 rounded-full bg-[#2c2c2e] text-neutral-400 flex items-center justify-center active:scale-90">✕</button>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div class="bg-[#242426] p-2.5 rounded-xl border border-neutral-800 text-center">
          <div class="text-[10px] text-neutral-400">Days Logged</div>
          <div id="statTotalDays" class="text-lg font-bold font-num text-white">0</div>
        </div>
        <div class="bg-[#242426] p-2.5 rounded-xl border border-neutral-800 text-center">
          <div class="text-[10px] text-neutral-400">Completed (100%)</div>
          <div id="statPerfectDays" class="text-lg font-bold font-num text-emerald-400">0</div>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto custom-scrollbar p-1">
        <div id="heatmapGrid" class="grid grid-cols-7 gap-1.5 p-2 bg-[#121214] rounded-2xl border border-neutral-800"></div>
      </div>

      <div class="flex items-center justify-between text-[11px] text-neutral-400 px-1 border-t border-neutral-800 pt-2">
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm bg-[#242426]"></span> Incomplete</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm bg-emerald-700"></span> Partial</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm bg-emerald-400"></span> Completed</span>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT STATE ENGINE -->
  <script>
    const STORAGE_GOALS_KEY = 'winter_arc_goals_list_v2';
    const STORAGE_LOGS_KEY = 'winter_arc_daily_logs_v2';
    const HAPTIC_KEY = 'winter_arc_haptic_enabled';

    const defaultGoals = [
      { id: "g_1", title: "Wake up early at 5:00 AM" },
      { id: "g_2", title: "Morning intense workout / lift" },
      { id: "g_3", title: "Hit 10,000 daily steps" },
      { id: "g_4", title: "Drink 3.5 liters of clean water" },
      { id: "g_5", title: "Cold shower discipline" },
      { id: "g_6", title: "Zero sugar & zero junk food" },
      { id: "g_7", title: "100% strict diet / hit protein goal" },
      { id: "g_8", title: "Read 15 pages of non-fiction" },
      { id: "g_9", title: "2.5 hours deep focused work" },
      { id: "g_10", title: "No alcohol or cheat indulgences" },
      { id: "g_11", title: "Zero mindless doomscrolling" },
      { id: "g_12", title: "15 minutes evening reflection / plan" },
      { id: "g_13", title: "Take core daily vitamins & omega" },
      { id: "g_14", title: "No screen 45 mins before bedtime" },
      { id: "g_15", title: "Sleep 7-8 hours sound rest" }
    ];

    let currentDate = new Date();
    currentDate.setHours(0, 0, 0, 0);

    function loadInitialGoals() {
      const stored = localStorage.getItem(STORAGE_GOALS_KEY);
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length > 0) {
            if (typeof parsed[0] === 'string') {
              return parsed.map((t, idx) => ({ id: `g_${Date.now()}_${idx}`, title: t }));
            }
            return parsed;
          }
        } catch (e) {}
      }
      return defaultGoals;
    }

    let state = {
      hapticEnabled: localStorage.getItem(HAPTIC_KEY) !== 'false',
      goals: loadInitialGoals(),
      logs: JSON.parse(localStorage.getItem(STORAGE_LOGS_KEY) || '{}')
    };

    function saveState() {
      localStorage.setItem(STORAGE_GOALS_KEY, JSON.stringify(state.goals));
      localStorage.setItem(STORAGE_LOGS_KEY, JSON.stringify(state.logs));
      localStorage.setItem(HAPTIC_KEY, state.hapticEnabled);
    }

    function getDateKey(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    const audioCtx = typeof AudioContext !== 'undefined' ? new (window.AudioContext || window.webkitAudioContext)() : null;
    function playAudio(frequency, duration) {
      if (!audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function vibrate(type = 'default') {
      if (!state.hapticEnabled) return;
      if (navigator.vibrate) {
        if (type === 'done') navigator.vibrate([15, 30, 20]);
        else if (type === 'not_done') navigator.vibrate(25);
        else navigator.vibrate(10);
      }
      if (type === 'done') playAudio(520, 0.08);
      else if (type === 'not_done') playAudio(180, 0.08);
      else playAudio(280, 0.04);
    }

    function formatDisplayDate(d) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const isToday = d.getTime() === today.getTime();
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const dayStr = String(d.getDate()).padStart(2, '0');
      const monthStr = monthNames[d.getMonth()];

      if (isToday) return `Today, ${dayStr} ${monthStr}`;
      return `${dayStr} ${monthStr} ${d.getFullYear()}`;
    }

    function renderDashboard() {
      document.getElementById('dateDisplayLabel').textContent = formatDisplayDate(currentDate);

      const dateKey = getDateKey(currentDate);
      const dayLog = state.logs[dateKey] || {};

      let doneCount = 0;
      let totalGoals = state.goals.length;

      const goalsContainer = document.getElementById('goalsContainer');
      goalsContainer.innerHTML = '';

      state.goals.forEach((goal) => {
        const status = dayLog[goal.id] || null;
        if (status === 'done') doneCount++;

        const row = document.createElement('div');
        row.className = `flex items-center justify-between px-2.5 py-1.5 sm:py-2 rounded-xl border transition-all ${
          status === 'done' 
            ? 'bg-[#18281d]/50 border-emerald-900/50' 
            : status === 'not_done' 
            ? 'bg-[#2b1818]/50 border-red-950/60' 
            : 'bg-[#1c1c1e] border-neutral-800/80'
        }`;

        const textWrapper = document.createElement('div');
        textWrapper.className = 'flex-1 min-w-0 pr-2';
        textWrapper.innerHTML = `
          <div class="text-xs sm:text-[13px] font-medium leading-tight truncate ${
            status === 'done' ? 'text-neutral-400 line-through' : status === 'not_done' ? 'text-red-300' : 'text-neutral-200'
          }">
            ${goal.title}
          </div>
        `;

        const actions = document.createElement('div');
        actions.className = 'flex items-center space-x-1 shrink-0';

        const tickBtn = document.createElement('button');
        tickBtn.setAttribute('aria-label', 'Mark Done');
        tickBtn.className = `w-7 h-7 rounded-lg flex items-center justify-center transition-transform active:scale-75 ${
          status === 'done'
            ? 'bg-emerald-500 text-black shadow-[0_0_8px_rgba(48,209,88,0.4)]'
            : 'bg-[#2c2c2e] hover:bg-[#343438] text-neutral-400'
        }`;
        tickBtn.innerHTML = `
          <svg class="w-3.5 h-3.5 stroke-current" fill="none" stroke-width="2.6" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
          </svg>
        `;
        tickBtn.onclick = () => toggleGoalStatus(goal.id, 'done');

        const crossBtn = document.createElement('button');
        crossBtn.setAttribute('aria-label', 'Mark Not Done');
        crossBtn.className = `w-7 h-7 rounded-lg flex items-center justify-center transition-transform active:scale-75 ${
          status === 'not_done'
            ? 'bg-red-500 text-white shadow-[0_0_8px_rgba(255,69,58,0.4)]'
            : 'bg-[#2c2c2e] hover:bg-[#343438] text-neutral-400'
        }`;
        crossBtn.innerHTML = `
          <svg class="w-3.5 h-3.5 stroke-current" fill="none" stroke-width="2.6" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        `;
        crossBtn.onclick = () => toggleGoalStatus(goal.id, 'not_done');

        actions.appendChild(tickBtn);
        actions.appendChild(crossBtn);

        row.appendChild(textWrapper);
        row.appendChild(actions);
        goalsContainer.appendChild(row);
      });

      const pct = totalGoals > 0 ? Math.round((doneCount / totalGoals) * 100) : 0;
      document.getElementById('doneRatioLabel').textContent = `${doneCount}/${totalGoals}`;
      document.getElementById('percentLabel').textContent = `${pct}%`;
      document.getElementById('executionProgressBar').style.width = `${pct}%`;
      document.getElementById('goalsCountBadge').textContent = `${totalGoals} Goals`;
    }

    function toggleGoalStatus(goalId, targetStatus) {
      const dateKey = getDateKey(currentDate);
      if (!state.logs[dateKey]) state.logs[dateKey] = {};

      const currentStatus = state.logs[dateKey][goalId];
      if (currentStatus === targetStatus) {
        delete state.logs[dateKey][goalId];
        vibrate();
      } else {
        state.logs[dateKey][goalId] = targetStatus;
        vibrate(targetStatus);
      }

      saveState();
      renderDashboard();
    }

    // ARROW NAVIGATION
    document.getElementById('prevDayBtn').addEventListener('click', () => {
      vibrate();
      currentDate.setDate(currentDate.getDate() - 1);
      renderDashboard();
    });

    document.getElementById('nextDayBtn').addEventListener('click', () => {
      vibrate();
      currentDate.setDate(currentDate.getDate() + 1);
      renderDashboard();
    });

    // 3-DOT CONTROLS
    const moreMenuBtn = document.getElementById('moreMenuBtn');
    const moreActionSheet = document.getElementById('moreActionSheet');
    const closeMoreSheet = document.getElementById('closeMoreSheet');

    moreMenuBtn.addEventListener('click', () => {
      vibrate();
      moreActionSheet.classList.remove('hidden');
      moreActionSheet.classList.add('flex');
    });

    closeMoreSheet.addEventListener('click', () => {
      vibrate();
      moreActionSheet.classList.add('hidden');
      moreActionSheet.classList.remove('flex');
    });

    // TAP ON DAY EXECUTION TO OPEN HEATMAP
    const dayExecutionCard = document.getElementById('dayExecutionCard');
    const heatmapModal = document.getElementById('heatmapModal');
    const closeHeatmapBtn = document.getElementById('closeHeatmapBtn');

    dayExecutionCard.addEventListener('click', () => {
      vibrate();
      renderHeatmap();
      heatmapModal.classList.remove('hidden');
      heatmapModal.classList.add('flex');
    });

    closeHeatmapBtn.addEventListener('click', () => {
      vibrate();
      heatmapModal.classList.add('hidden');
      heatmapModal.classList.remove('flex');
    });

    // WINTER ARC HEATMAP (OCTOBER 1 TO DECEMBER 31)
    function renderHeatmap() {
      const heatmapGrid = document.getElementById('heatmapGrid');
      heatmapGrid.innerHTML = '';

      let year = currentDate.getFullYear();
      if (currentDate.getMonth() < 9) {
        year = currentDate.getFullYear() - 1;
      }

      const arcStart = new Date(year, 9, 1);
      const arcEnd = new Date(year, 11, 31);
      const totalArcDays = 92;

      let loggedDays = 0;
      let completedDays = 0;

      for (let i = 0; i < totalArcDays; i++) {
        const cellDate = new Date(year, 9, 1 + i);
        cellDate.setHours(0, 0, 0, 0);

        const key = getDateKey(cellDate);
        const dayRecord = state.logs[key];

        let cellColor = 'bg-[#242426]';
        const dayNumber = i + 1;
        let title = `Day ${dayNumber} (${formatDisplayDate(cellDate)}): Not logged`;

        if (dayRecord && Object.keys(dayRecord).length > 0) {
          loggedDays++;
          const done = Object.values(dayRecord).filter(v => v === 'done').length;
          const ratio = state.goals.length > 0 ? done / state.goals.length : 0;

          if (ratio === 1) {
            cellColor = 'bg-emerald-400';
            completedDays++;
            title = `${formatDisplayDate(cellDate)}: Completed`;
          } else if (ratio > 0) {
            cellColor = 'bg-emerald-700';
            title = `${formatDisplayDate(cellDate)}: ${Math.round(ratio * 100)}% Execution`;
          }
        }

        const cell = document.createElement('div');
        cell.className = `w-full aspect-square rounded-md ${cellColor} transition-transform active:scale-75 cursor-pointer border border-white/5`;
        cell.title = title;
        cell.onclick = () => {
          vibrate();
          currentDate = new Date(cellDate);
          renderDashboard();
          heatmapModal.classList.add('hidden');
          heatmapModal.classList.remove('flex');
        };
        heatmapGrid.appendChild(cell);
      }

      document.getElementById('statTotalDays').textContent = loggedDays;
      document.getElementById('statPerfectDays').textContent = completedDays;
    }

    // DRAG-AND-DROP GOALS MANAGER
    const openGoalsManagerBtn = document.getElementById('openGoalsManagerBtn');
    const goalsManagerModal = document.getElementById('goalsManagerModal');
    const closeGoalsManagerBtn = document.getElementById('closeGoalsManagerBtn');
    const goalsManagerList = document.getElementById('goalsManagerList');
    const addNewGoalBtn = document.getElementById('addNewGoalBtn');
    const newGoalInput = document.getElementById('newGoalInput');

    let draggedItemIdx = null;

    function renderGoalsManager() {
      goalsManagerList.innerHTML = '';
      state.goals.forEach((goal, idx) => {
        const item = document.createElement('div');
        item.draggable = true;
        item.dataset.index = idx;
        item.className = 'drag-item flex items-center justify-between py-2 px-1 text-xs text-white rounded-lg select-none hover:bg-neutral-800/40 transition-colors';
        item.innerHTML = `
          <div class="flex items-center space-x-2 flex-1 min-w-0 pr-2">
            <span class="cursor-grab active:cursor-grabbing text-neutral-500 hover:text-neutral-300 p-1 drag-handle">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 8h16M4 16h16"/>
              </svg>
            </span>
            <span class="truncate text-neutral-200 font-medium">${goal.title}</span>
          </div>
          <button class="delete-goal-btn text-neutral-500 hover:text-red-400 p-1.5 rounded-lg active:scale-90 transition-colors" data-idx="${idx}">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
          </button>
        `;

        // Desktop HTML5 drag events
        item.addEventListener('dragstart', (e) => {
          draggedItemIdx = idx;
          item.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });

        item.addEventListener('dragend', () => {
          item.classList.remove('dragging');
          draggedItemIdx = null;
        });

        item.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
        });

        item.addEventListener('drop', (e) => {
          e.preventDefault();
          const targetIdx = parseInt(item.dataset.index);
          if (draggedItemIdx !== null && draggedItemIdx !== targetIdx) {
            const movedGoal = state.goals.splice(draggedItemIdx, 1)[0];
            state.goals.splice(targetIdx, 0, movedGoal);
            saveState();
            renderGoalsManager();
            renderDashboard();
            vibrate();
          }
        });

        // Touch event support for iOS reordering
        const handle = item.querySelector('.drag-handle');
        handle.addEventListener('touchstart', (e) => {
          draggedItemIdx = idx;
          item.classList.add('dragging');
        }, { passive: true });

        handle.addEventListener('touchmove', (e) => {
          const touchLocation = e.targetTouches[0];
          const elem = document.elementFromPoint(touchLocation.clientX, touchLocation.clientY);
          const targetRow = elem ? elem.closest('.drag-item') : null;
          if (targetRow && targetRow.dataset.index !== undefined) {
            const overIdx = parseInt(targetRow.dataset.index);
            if (overIdx !== draggedItemIdx) {
              const movedGoal = state.goals.splice(draggedItemIdx, 1)[0];
              state.goals.splice(overIdx, 0, movedGoal);
              draggedItemIdx = overIdx;
              saveState();
              renderGoalsManager();
              renderDashboard();
            }
          }
        }, { passive: true });

        handle.addEventListener('touchend', () => {
          item.classList.remove('dragging');
          draggedItemIdx = null;
          vibrate();
        });

        goalsManagerList.appendChild(item);
      });

      goalsManagerList.querySelectorAll('.delete-goal-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          vibrate();
          const idx = parseInt(btn.getAttribute('data-idx'));
          if (state.goals.length <= 1) {
            alert("Keep at least one goal in your arc.");
            return;
          }
          state.goals.splice(idx, 1);
          saveState();
          renderGoalsManager();
          renderDashboard();
        });
      });
    }

    openGoalsManagerBtn.addEventListener('click', () => {
      vibrate();
      moreActionSheet.classList.add('hidden');
      moreActionSheet.classList.remove('flex');
      renderGoalsManager();
      goalsManagerModal.classList.remove('hidden');
      goalsManagerModal.classList.add('flex');
    });

    closeGoalsManagerBtn.addEventListener('click', () => {
      vibrate();
      goalsManagerModal.classList.add('hidden');
      goalsManagerModal.classList.remove('flex');
    });

    addNewGoalBtn.addEventListener('click', () => {
      const val = newGoalInput.value.trim();
      if (!val) return;
      vibrate();
      state.goals.push({ id: `g_${Date.now()}`, title: val });
      newGoalInput.value = '';
      saveState();
      renderGoalsManager();
      renderDashboard();
    });

    // HAPTIC CONTROLS
    const hapticToggleBtn = document.getElementById('hapticToggleBtn');
    const hapticToggleThumb = document.getElementById('hapticToggleThumb');

    function syncHapticUI() {
      if (state.hapticEnabled) {
        hapticToggleBtn.classList.remove('bg-neutral-700');
        hapticToggleBtn.classList.add('bg-blue-600');
        hapticToggleThumb.classList.remove('translate-x-0');
        hapticToggleThumb.classList.add('translate-x-5');
      } else {
        hapticToggleBtn.classList.remove('bg-blue-600');
        hapticToggleBtn.classList.add('bg-neutral-700');
        hapticToggleThumb.classList.remove('translate-x-5');
        hapticToggleThumb.classList.add('translate-x-0');
      }
    }

    hapticToggleBtn.addEventListener('click', () => {
      state.hapticEnabled = !state.hapticEnabled;
      syncHapticUI();
      saveState();
      vibrate();
    });

    // EXPORT CSV
    document.getElementById('menuExportBtn').addEventListener('click', () => {
      vibrate();
      const keys = Object.keys(state.logs).sort();
      if (keys.length === 0) {
        alert("No logs to export.");
        return;
      }

      const goalMap = {};
      state.goals.forEach(g => { goalMap[g.id] = g.title; });

      let csv = "Date,Goal,Status\n";
      keys.forEach(k => {
        const dayRecord = state.logs[k];
        Object.entries(dayRecord).forEach(([id, val]) => {
          const gName = goalMap[id] || id;
          csv += `"${k}","${gName}","${val}"\n`;
        });
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `winter_arc_logs_${Date.now()}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      moreActionSheet.classList.add('hidden');
      moreActionSheet.classList.remove('flex');
    });

    // CLEAR DAY
    document.getElementById('menuResetDayBtn').addEventListener('click', () => {
      vibrate();
      const key = getDateKey(currentDate);
      if (confirm(`Reset all tracked data for ${key}?`)) {
        delete state.logs[key];
        saveState();
        renderDashboard();
      }
      moreActionSheet.classList.add('hidden');
      moreActionSheet.classList.remove('flex');
    });

    // INITIALIZATION
    window.addEventListener('DOMContentLoaded', () => {
      syncHapticUI();
      renderDashboard();
    });
  </script>
</body>
</html>
